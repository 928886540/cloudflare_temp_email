    gap: 6px;
    width: clamp(86px, min(6.5vw, 13vmin), 116px);

    overflow: hidden;
  }
  
  /* 顶部细腻弧面月牙高光 (Crescent Specular Highlight) */
  .entry-actions > a.jade-pill::before {
    content: "";

    top: 3px;
    left: 15%;
    width: 70%;
    height: 38%;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;

}
