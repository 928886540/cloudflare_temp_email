name: Configure LeonMinGod human verification
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, setup, verify, verify-pass, audit-api]
        default: inspect
permissions:
  contents: read
concurrency:
  group: free-token-home-production
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SECURITY_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - if: inputs.mode != 'verify' && inputs.mode != 'audit-api'
        run: python .github/scripts/leonmingod_security.py
      - if: inputs.mode == 'audit-api'
        run: |
          python -m pip install cryptography
          python .github/scripts/api_abuse_audit.py
      - if: inputs.mode == 'audit-api' && always()
        uses: actions/upload-artifact@v4
        with:
          name: api-abuse-configuration-backup
          path: api-abuse-audit/
          retention-days: 30
      - if: inputs.mode == 'verify'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - if: inputs.mode == 'verify'
        run: node sites/leonmingod-star-night/scripts/verify-live.mjs
      - if: inputs.mode == 'verify' && always()
        uses: actions/upload-artifact@v4
        with:
          name: leonmingod-live-security-verification
          path: live-security-result.json
          if-no-files-found: ignore
          retention-days: 90
