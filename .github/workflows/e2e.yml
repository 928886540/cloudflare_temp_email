name: End-to-End Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      # The generic temp-email E2E stack does not exercise the standalone
      # LeonMinGod website or its operations scripts. Cursor often updates a
      # website PR several times, which used to cancel the preceding E2E run
      # and generate noisy "old job" notifications.
      - "sites/leonmingod-star-night/**"
      - "sites/free-token-home/**"
      - ".github/scripts/leonmingod_*.py"
      - ".github/scripts/yifu_keys.py"
      - ".github/scripts/issue_yifu_key.py"
      - ".github/scripts/free_token_render.py"
      - ".github/workflows/leonmingod-*.yaml"
      - ".github/workflows/yifu-*.yaml"
      - ".github/workflows/*free-token*.yaml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run E2E tests
        run: |
          cd e2e
          docker compose up --build --abort-on-container-exit --exit-code-from e2e-runner

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          cd e2e
          docker compose down -v
