name: Codium PR Agent

# This reviewer is intentionally manual. It previously ran on every PR with an
# unconfigured model credential, failed, posted a bot comment, and generated
# duplicate failure emails. Keep it available for future repair without letting
# it affect normal pull requests.
on:
  workflow_dispatch:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CONFIG.MODEL: "gpt-5.4-nano"
          CONFIG.MODEL_TURBO: "gpt-5.4-nano"
          OPENAI.API_BASE: ${{ secrets.OPENAI_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
