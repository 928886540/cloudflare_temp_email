name: Deploy Free Token entrance
on:
  push:
    branches: [codex/free-token-home-20261024]
    paths:
      - sites/free-token-home/**
      - .github/workflows/deploy-free-token-home.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: free-token-home-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Check source syntax
        run: |
          node --check sites/free-token-home/src/index.js
          node --check sites/free-token-home/src/landing.js
          node --check sites/free-token-home/src/site-original.js
          python -m py_compile sites/free-token-home/deploy.py
      - name: Deploy and verify Free Token entrance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python sites/free-token-home/deploy.py
