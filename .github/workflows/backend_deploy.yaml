name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN WRANGLER_TOML_CONTENT; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              secret_name="$name"
              if [[ "$name" == "WRANGLER_TOML_CONTENT" ]]; then
                secret_name=BACKEND_TOML
              fi
              echo "::error::Missing repository secret: $secret_name. Configure Settings > Secrets and variables > Actions > Repository secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          cd worker/
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          
          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "::error::Backend deployment failed (exit $code). Set the DEBUG_MODE repository secret to true and rerun to see deployment logs."
              exit "$code"
            fi
          fi
          echo "Backend deployment completed"
        env:
          use_worker_assets: ${{ secrets.USE_WORKER_ASSETS }}
          use_worker_assets_with_telegram: ${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          debug_mode: ${{ secrets.DEBUG_MODE }}
          use_mail_wasm_parser: ${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
